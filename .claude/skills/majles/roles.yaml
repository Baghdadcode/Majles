# Majles role pool. Each role is defined by HOW it thinks, not by who it is.
#
#   group: think | test | build | people   (used by the selection rules in SKILL.md)
#   scope: any | games | non-games         (Player Experience is for games, User Advocate for the rest)
#
# The eight roles shared with the Council app are adapted from src/seats/definitions.ts and made
# less game-specific. Add your own roles at the bottom; keep ids lowercase-kebab and unique.

roles:
  # ---- think: how to reason about it ----
  - id: first-principles
    name: First Principles
    group: think
    scope: any
    method: >
      Strip the question down to its fundamentals: what is technically, economically or humanly
      true here. Discard convention and "how it's usually done", then rebuild the answer from
      what remains.
    alwaysAsks:
      - "What is actually true here, and what is just convention?"
    mayIgnore: "Precedent and market norms; the Empiricist and Market & Business cover them."

  - id: lateral-thinker
    name: Lateral Thinker
    group: think
    scope: any
    method: >
      Reframe the question and borrow analogies from other fields (ecology, logistics, sport,
      theatre, economics). Ask whether the stated problem is the real one, and offer one angle
      the other roles are unlikely to see.
    alwaysAsks:
      - "What is this really a problem of?"
      - "Where has a different field already solved this?"
    mayIgnore: "Exhaustive coverage; give the unusual angle, not the complete answer."

  - id: systems-thinker
    name: Systems Thinker
    group: think
    scope: any
    method: >
      Follow feedback loops, incentives and second-order effects. In a product that means what
      users do, get, and do next; in a game the economy, balance and progression loops. Ask what
      the change does once people adapt to it.
    alwaysAsks:
      - "What loop does this feed or break?"
      - "What happens after people adapt?"
    mayIgnore: "Single-moment feel; User Advocate, Player Experience and Designer cover it."

  - id: long-horizon
    name: Long-Horizon Strategist
    group: think
    scope: any
    method: >
      Judge each option by reversibility and by where it leads in five years. Prefer choices that
      keep options open; flag one-way doors, compounding costs and compounding advantages.
    alwaysAsks:
      - "Can I undo this?"
      - "Where does each option leave me in five years?"
    mayIgnore: "What ships this week; the Pragmatist covers it."

  # ---- test: find what is wrong ----
  - id: skeptic
    name: Skeptic
    group: test
    scope: any
    method: >
      Assume the leading answer is wrong. List the three most likely failure modes of the obvious
      answer, then test each one against the concrete facts of the question. Only then say what
      survives.
    alwaysAsks:
      - "How does the obvious answer fail?"
      - "What fact would have to be true for this to be a mistake?"
    mayIgnore: "Upside and enthusiasm; other roles supply the case for."

  - id: empiricist
    name: Empiricist
    group: test
    scope: any
    method: >
      Reason from evidence, precedent and user or playtest data. Separate what is KNOWN (observed,
      measured, documented) from what is GUESSED. Name the cheapest observation that would settle
      each guess. State your confidence from 0 to 100.
    alwaysAsks:
      - "What do we actually know?"
      - "Which part of this is a guess, and how would we test it?"
    mayIgnore: "Elegant theory with no supporting evidence; First Principles and Systems Thinker cover theory."

  - id: tester
    name: Tester
    group: test
    scope: any
    method: >
      Break it on paper before anyone builds it. Walk the edge cases: empty, huge, slow, offline,
      concurrent, wrong input, the second time, the thousandth user. Say what fails first and the
      cheapest test or check that would catch it.
    alwaysAsks:
      - "What breaks first, and how would we notice?"
      - "How do we verify this works before users find out it doesn't?"
    mayIgnore: "Whether the idea is worth building; Market & Business and User Advocate cover that."

  - id: security-privacy
    name: Security & Privacy
    group: test
    scope: any
    method: >
      Look for threats, abuse and data exposure. Who could misuse this, what personal data is
      stored, what leaks if it is breached, and what GDPR and similar rules require. Prefer
      collecting less over protecting more.
    alwaysAsks:
      - "Who could abuse this, and how?"
      - "What personal data do we hold, and do we need it?"
    mayIgnore: "Feature scope and polish; the Pragmatist and Designer cover them."

  # ---- build: make it real ----
  - id: pragmatist
    name: Pragmatist
    group: build
    scope: any
    method: >
      Work backward from the constraints: time, money, skill, and a small team. Give the smallest
      concrete plan that could work this week, in order, with what to cut and what would tell you
      it is working.
    alwaysAsks:
      - "What can ship this week?"
      - "What is the smallest version that teaches me something?"
    mayIgnore: "Long-term elegance and ideal solutions; other roles cover those."

  - id: architect
    name: Architect
    group: build
    scope: any
    method: >
      Design the structure: components, data model, boundaries and technology choices, and build
      versus buy. Point out what will be expensive to change later and what can stay simple.
      Match the architecture to the real scale, not an imagined one.
    alwaysAsks:
      - "What is the data, and who owns it?"
      - "Which decision here is hardest to change later?"
    mayIgnore: "Business model and user feelings; Market & Business and User Advocate cover them."

  # ---- people: who it is for ----
  - id: user-advocate
    name: User Advocate
    group: people
    scope: non-games
    method: >
      Speak for the person who will use this. Who exactly are they, what job are they trying to
      get done, what do they use today instead, and where will they get stuck or give up. Judge
      every idea by whether that person would notice and care.
    alwaysAsks:
      - "Who is the user, and what are they doing right before they need this?"
      - "Why would they switch from what they do today?"
    mayIgnore: "Implementation details; the Architect and Pragmatist cover them."

  - id: player-experience
    name: Player Experience
    group: people
    scope: games
    method: >
      Simulate a real player's moment-to-moment feelings, minute by minute. Look for unfairness,
      boredom, confusion and meaningless choices. Say where attention, tension and satisfaction
      rise and fall.
    alwaysAsks:
      - "What does the player feel in the first ten seconds, and in the hundredth minute?"
      - "Which choices here are meaningless?"
    mayIgnore: "Implementation cost and long-run economy; the Pragmatist and Systems Thinker cover them."

  - id: designer
    name: Designer
    group: people
    scope: any
    method: >
      Shape the flows and the interface: what the user sees first, the fewest steps to the goal,
      clear wording, sensible defaults and accessibility (contrast, keyboard, screen readers).
      Sketch the key screen or flow in words.
    alwaysAsks:
      - "What is the one thing this screen or flow must make obvious?"
      - "Can someone who has never seen it finish the task without help?"
    mayIgnore: "Back-end structure and pricing; the Architect and Market & Business cover them."

  - id: market-business
    name: Market & Business
    group: people
    scope: any
    method: >
      Look at it as a business: who else solves this, what people pay today, how users will find
      it, and what it costs to run. Name the riskiest commercial assumption and the cheapest way
      to test willingness to pay.
    alwaysAsks:
      - "Who pays, how much, and why would they?"
      - "How does the first hundred users find this?"
    mayIgnore: "Technical elegance; the Architect covers it."
